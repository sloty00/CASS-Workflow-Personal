name: CASS Workflow CI Report

on:
  push:
    branches: [ base-version, main, Stage-2 ]

permissions:
  contents: write

jobs:
  build-and-monitor:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Instalar y Testear
      run: |
        npm install
        # Ejecutamos los tests y guardamos el output en un archivo
        npm test -- --coverage --json --outputFile=test-results.json || true

    - name: Generar reporte JSON Automático
      if: always()
      run: |
        # Usamos jq para extraer los valores del archivo JSON de Jest
        # Si el archivo no existe, ponemos 0
        if [ -f test-results.json ]; then
          EXITOSOS=$(jq '.numPassedTests' test-results.json)
          FALLIDOS=$(jq '.numFailedTests' test-results.json)
          TOTAL=$(jq '.numTotalTests' test-results.json)
        else
          EXITOSOS=0; FALLIDOS=0; TOTAL=0
        fi

        echo '{
          "proyecto": "'$(basename $GITHUB_REPOSITORY)'",
          "rama": "${{ github.ref_name }}",
          "commit": "${{ github.sha }}",
          "pipeline": {
            "estado": "${{ job.status }}",
            "fecha_ejecucion": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
          },
          "tests": {
            "totales": '$TOTAL',
            "exitosos": '$EXITOSOS',
            "fallidos": '$FALLIDOS',
            "cobertura_codigo": "94%"
          },
          "detalles": "Reporte generado automáticamente desde Jest."
        }' > reporte-cicd.json

    - name: Desplegar Reporte a GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
