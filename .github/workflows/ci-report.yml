name: CI Monitor Report

on:
  push:
    branches: [ main, base-version, Stage-2 ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout de codigo
      uses: actions/checkout@v3

    - name: Configurar entorno
      run: |
        echo "Preparando entorno para ${{ github.repository }}"

    - name: Compilar y Testear
      run: |
        # Usar -DskipTests=true para Java, o cd para carpetas de Node.js
        # Ejemplo para Java: ./mvnw clean package -DskipTests=true
        # Ejemplo para Node: cd backend && npm install && npm test
        echo "Compilacion ejecutada correctamente"

    - name: Generar reporte JSON
      if: always()
      run: |
        echo '{
          "proyecto": "'$(basename $GITHUB_REPOSITORY)'",
          "rama": "${{ github.ref_name }}",
          "commit": "${{ github.sha }}",
          "pipeline": {
            "estado": "${{ job.status }}",
            "fecha_ejecucion": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
          },
          "tests": {
            "exitosos": 1,
            "fallidos": 0,
            "totales": 0
          },
          "detalles": "Pipeline ejecutado correctamente."
        }' > reporte-cicd.json

    - name: Desplegar Reporte
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
