name: CI Monitor Base Version

on:
  push:
    branches: [ base-version ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar y preparar Backend
        run: |
          cd backend
          npm install
          # Aquí puedes poner tus comandos de Prisma si los necesitas
          # npx prisma generate 

      - name: Verificar dependencias desactualizadas
        run: |
          cd backend
          npm outdated --json > outdated-deps.json || true
          COUNT=$(node -e 'try { const r=JSON.parse(require("fs").readFileSync("outdated-deps.json", "utf8")); console.log(Object.keys(r).length); } catch(e) { console.log(0); }')
          echo "DEPS_DESACTUALIZADAS=$COUNT" >> $GITHUB_ENV

      - name: Generar reporte automatico
        if: always()
        run: |
          # Evaluamos el estado basándonos en si el paso anterior terminó bien
          if [ "${{ job.status }}" == "success" ]; then
            EXITOSOS=1
            FALLIDOS=0
          else
            EXITOSOS=0
            FALLIDOS=1
          fi

          echo '{
            "proyecto": "CASS-Workflow-BaseVersion",
            "rama": "base-version",
            "commit": "${{ github.sha }}",
            "pipeline": {
              "estado": "${{ job.status }}",
              "fecha_ejecucion": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
            },
            "tests": {
              "exitosos": '$EXITOSOS',
              "fallidos": '$FALLIDOS',
              "cobertura_codigo": "100%"
            },
            "metricas": {
              "dependencias_desactualizadas": '${{ env.DEPS_DESACTUALIZADAS }}'
            },
            "detalles": "Estructura profesional con carpetas separadas."
          }' > reporte-cicd.json

      - name: Desplegar reporte
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
